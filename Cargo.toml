[workspace]
members = [
    "crates/betamax",
    "crates/betamax-core",
    "crates/betamax-fonts",
]
default-members = ["crates/betamax"]
resolver = "2"

[workspace.package]
version = "0.3.1"
edition = "2021"
rust-version = "1.93"
license = "MIT OR Apache-2.0"
repository = "https://github.com/joshka/betamax"
homepage = "https://www.joshka.net/betamax/"
documentation = "https://www.joshka.net/betamax/"

[workspace.dependencies]
anyhow = "1.0.102"
base64 = "0.22"
betamax-core = { path = "crates/betamax-core", version = "0.3.1" }
betamax-fonts = { path = "crates/betamax-fonts", version = "0.3.1" }
clap = { version = "4.5.20", features = ["derive", "wrap_help"] }
clap-stdin = "0.8"
color_quant = "1.1"
cosmic-text = "0.19"
gif = "0.14"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
image-webp = "0.2"
glob = "0.3"
interpolator = "0.5"
indicatif = "0.18.4"
indoc = "2"
insta = { version = "1.49.0", features = ["json"] }
libghostty-vt = { version = "0.2.1", features = ["tracing"] }
miette = "7"
png = "0.18"
portable-pty = "0.9"
qwertty-term-sprite = "0.4.0"
regex = "1.12.2"
serde = { version = "1.0.220", features = ["derive"] }
serde_json = "1.0.142"
shell-words = "1.1"
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
vergen = { version = "10.0.0", features = ["build", "cargo"] }

[workspace.lints.rust]
missing_debug_implementations = "warn"
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
unused_result_ok = "warn"

name: CI

# CI calls mise tasks instead of spelling out long command lines in YAML. That keeps local and CI
# behavior aligned, and it ensures Cargo sees the Zig 0.15.2 version required by
# libghostty-vt-sys.
on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions: {}

jobs:
  lint:
    name: Lint, docs, and validation
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: clippy

      - name: Install nightly rustfmt
        run: rustup toolchain install nightly --component rustfmt

      - name: Install beta clippy
        run: rustup toolchain install beta --component clippy

      - name: Install mise tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v1-rust-no-target
          cache-targets: false

      - name: Test renderer PR comments
        run: node --test scripts/renderer-comment.test.cjs

      - name: Check formatting
        run: mise run fmt-check

      - name: Check clippy
        run: mise run clippy

      - name: Check beta clippy
        run: mise run clippy-beta

      - name: Check documentation builds
        run: mise run doc

      - name: Run doc tests
        run: mise run doc-test

      - name: Lint Markdown
        run: mise run lint-md

      - name: Validate tapes
        run: mise run validate

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable

      - name: Install mise tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v1-rust-no-target
          cache-targets: false

      - name: Test renderer gallery reporting
        run: mise run renderer-gallery-test

      - name: Check workspace
        run: mise run cargo-check

      - name: Install renderer test fonts
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core fonts-noto-cjk

      - name: Install video test encoders
        if: runner.os == 'Linux'
        run: sudo apt-get install -y ffmpeg

      - name: Test video timing
        if: runner.os == 'Linux'
        run: mise run video-test

      - name: Test workspace
        id: tests
        env:
          BETAMAX_FIDELITY_OUTPUT: ${{ github.workspace }}/target/renderer-fidelity
        run: mise run test

      - name: Upload renderer checkpoints
        id: raw-checkpoints
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: renderer-fidelity-${{ matrix.os }}
          path: target/renderer-fidelity
          if-no-files-found: warn

      - name: Generate renderer gallery
        id: gallery
        if: ${{ always() }}
        env:
          PLATFORM: ${{ matrix.os }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          python3 scripts/renderer-gallery.py target/renderer-fidelity \
            "target/renderer-gallery/renderer-fidelity-${PLATFORM}.html" \
            --platform "$PLATFORM" --outcome "$TEST_OUTCOME" --revision "$GITHUB_SHA"

      - name: Upload renderer gallery
        id: gallery-upload
        if: ${{ always() && steps.gallery.outputs.available == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: target/renderer-gallery/renderer-fidelity-${{ matrix.os }}.html
          archive: false
          if-no-files-found: error

      - name: Link renderer evidence
        if: ${{ always() }}
        env:
          PLATFORM: ${{ runner.os }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          GALLERY_URL: ${{ steps.gallery-upload.outputs.artifact-url }}
          RAW_URL: ${{ steps.raw-checkpoints.outputs.artifact-url }}
        run: |
          {
            echo "## Renderer fidelity — $PLATFORM"
            echo
            if [ -n "$GALLERY_URL" ]; then
              echo "### [View $PLATFORM fixtures]($GALLERY_URL)"
            else
              echo "Gallery unavailable: no checkpoints were produced, or generation/upload failed. See the steps above."
            fi
            echo
            echo "Test step: **${TEST_OUTCOME:-not run}**. Failed runs may contain partial checkpoints."
            echo
            echo "Wide-glyph acceptance checks include CJK fallback coverage, both occupied cells, erasure/replacement, adjacent styles, and cursor overlays."
            if [ -n "$RAW_URL" ]; then
              echo
              echo "[Download raw PNG/JSON diagnostics (ZIP)]($RAW_URL)"
            fi
            echo
            echo "Artifacts require GitHub sign-in and expire with repository retention."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate tape syntax through CLI
        run: mise run validate

      - name: Check CLI version command
        run: mise run version

  package:
    name: Package and smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable

      - name: Install nightly rustfmt
        run: rustup toolchain install nightly --component rustfmt

      - name: Install mise tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v1-rust-no-target
          cache-targets: false

      - name: Package crates
        run: mise run package

      - name: Install CLI from path
        run: mise run install-smoke

      - name: Render smoke tape
        run: mise run smoke

  dependencies:
    name: Dependency check (${{ matrix.name }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.allow-failure }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: dependency policy
            tools: cargo-deny
            command: mise run dependency-policy
            allow-failure: false
          - name: features
            tools: cargo-hack
            command: mise run feature-check
            allow-failure: false
          - name: minimal versions
            tools: cargo-minimal-versions,cargo-hack
            command: mise run minimal-versions
            allow-failure: false
          - name: unused dependencies
            tools: cargo-udeps
            command: mise run udeps
            allow-failure: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable

      - name: Install nightly Rust
        run: rustup toolchain install nightly

      - name: Install mise tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v1-rust-no-target
          cache-targets: false

      - name: Install cargo maintenance tools
        uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff # v2.87.8
        with:
          tool: ${{ matrix.tools }}
          fallback: none

      - name: Run dependency check
        run: ${{ matrix.command }}

  required:
    name: Required
    runs-on: ubuntu-latest
    needs:
      - lint
      - test
      - package
      - dependencies
      - zizmor
    if: ${{ always() }}
    steps:
      - name: Check required jobs
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
          HAS_FAILED_JOB: >-
            ${{
              contains(needs.*.result, 'failure')
              || contains(needs.*.result, 'cancelled')
              || contains(needs.*.result, 'skipped')
            }}
        run: |
          echo "$NEEDS_JSON"
          test "$HAS_FAILED_JOB" = "false"

  zizmor:
    name: GitHub Actions security
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@70fb788f84895a7701f5643d103d587e460b5c99 # v0.6.3

name: Renderer gallery comment

# Trusted reporting only: never check out PR code or restore its caches. The native publisher
# independently validates untrusted media bytes; it never executes the PR-built binary.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: {}

concurrency:
  group: renderer-comment-${{ github.event.workflow_run.head_branch }}-${{ github.event.workflow_run.head_repository.id }}
  cancel-in-progress: false

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      # github.sha is the default-branch commit for workflow_run, NOT the triggering PR head.
      - name: Check out trusted reporter
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: scripts/renderer-comment.cjs
          sparse-checkout-cone-mode: false
      - name: Link renderer galleries
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await require('./scripts/renderer-comment.cjs')({ github, context });

  previews:
    if: github.event.workflow_run.event == 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: betamax-attachments
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      # The environment allows only the main branch. Keep the PAT there, never at repository
      # scope or in CI. GITHUB_TOKEN owns the comment; the PAT is used only for media uploads.
      # The pinned reporter checks run/PR metadata, artifact digests, sizes and signatures.
      - name: Publish PR-built CLI previews
        uses: joshka/betamax-action/report@46a3673d7a5dd7696b862848cb7e9902d797094d # local binary support
        with:
          workflow: ci.yml
          comment-key: cli
          mode: attachments
          attachment-token: ${{ secrets.BETAMAX_ATTACHMENT_TOKEN }}

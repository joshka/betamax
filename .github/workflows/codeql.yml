name: CodeQL

# CodeQL's Rust extractor can analyze this workspace without a build. That keeps the security scan
# independent from the native libghostty-vt-sys build and its pinned Zig 0.15.2 toolchain.
# https://docs.github.com/en/code-security/reference/code-scanning/codeql/build-options-for-compiled-languages#building-rust
on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "24 9 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  analyze:
    name: Analyze Rust
    # The release PR has already scanned the source being published.
    if: >-
      ${{ github.event_name != 'push' || !(startsWith(github.event.head_commit.message, 'chore: release') || contains(github.event.head_commit.message, '): release')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: rust
          build-mode: none
          queries: +security-extended

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2

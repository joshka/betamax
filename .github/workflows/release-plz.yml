name: Release-plz

# release-plz owns crate publishing, changelogs, tags, and GitHub Release creation. Binary asset
# jobs stay in this workflow because releases made with the default GITHUB_TOKEN do not trigger
# follow-up workflows:
# https://release-plz.dev/docs/github/token#how-to-trigger-further-workflow-runs
permissions: {}

env:
  LIBGHOSTTY_VT_SYS_CPU: baseline

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      operation:
        description: Publish prepared versions or refresh the release PR
        type: choice
        default: release
        options:
          - release
          - release-pr

jobs:
  release-plz-release:
    name: Release-plz release
    environment: release
    runs-on: ubuntu-latest
    # This job publishes crates and therefore enters the protected `release` environment. Keep it
    # off ordinary `main` pushes so non-release merges do not require release approval.
    #
    # release-plz release PRs are merged with squash commits whose subjects are `chore: release` or
    # the older `chore(<package>): release ...` form. Manual dispatch remains available for repair.
    if: >-
      ${{
        github.repository_owner == 'joshka' &&
        (
          (github.event_name == 'workflow_dispatch' && inputs.operation == 'release') ||
          startsWith(github.event.head_commit.message, 'chore: release') ||
          contains(github.event.head_commit.message, '): release')
        )
      }}
    permissions:
      contents: write
      pull-requests: read
      # crates.io Trusted Publishing uses GitHub OIDC, not CARGO_REGISTRY_TOKEN.
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - &install-rust
        name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
      - &install-mise
        name: Install mise tools
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          install: true
      - name: Run release-plz
        id: release-plz
        uses: release-plz/action@b8d6b54b02889ff2ae2bb82e8b57c3a8fc1683a5 # v0.5.139
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    # These release-plz outputs drive the same-run asset upload fan-out:
    # https://release-plz.dev/docs/github/output
    outputs:
      releases: ${{ steps.release-plz.outputs.releases }}
      releases_created: ${{ steps.release-plz.outputs.releases_created }}

  prepare-release-assets:
    name: Prepare release assets
    runs-on: ubuntu-latest
    needs: release-plz-release
    if: ${{ needs.release-plz-release.outputs.releases_created == 'true' }}
    # The workspace can release betamax-core without a matching CLI release. Only the CLI package
    # receives cargo-binstall archives, so extract its tag and version before building assets.
    outputs:
      betamax_released: ${{ steps.release.outputs.betamax_released }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Read Betamax release
        id: release
        env:
          RELEASES: ${{ needs.release-plz-release.outputs.releases }}
        run: |
          set -euo pipefail
          version="$(jq -r '.[] | select(.package_name == "betamax") | .version' <<<"$RELEASES" | head -n1)"
          tag="$(jq -r '.[] | select(.package_name == "betamax") | .tag' <<<"$RELEASES" | head -n1)"
          if [[ -z "$version" || -z "$tag" ]]; then
            echo "betamax_released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "betamax_released=true"
            echo "version=$version"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

  release-assets:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    needs: prepare-release-assets
    if: ${{ needs.prepare-release-assets.outputs.betamax_released == 'true' }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Build from the tag cargo-binstall downloads from, not from the workflow SHA.
          ref: ${{ needs.prepare-release-assets.outputs.tag }}
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Install mise tools
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          install: true
      - name: Cache release dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v2-rust-baseline
          key: release-${{ matrix.target }}-${{ hashFiles('.mise.toml') }}
          env-vars: CARGO CC CFLAGS CXX CMAKE RUST LIBGHOSTTY
          cache-targets: true
      - name: Build CLI
        env:
          TARGET: ${{ matrix.target }}
        run: mise run build-release -- "$TARGET"
      - name: Package archive
        id: package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.prepare-release-assets.outputs.version }}
        run: |
          set -euo pipefail
          archive="$(scripts/package-binstall-archive.sh "$TARGET" "$VERSION" target/dist)"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
      - name: Upload archive
        env:
          # This token only mutates the release created earlier in the same workflow run.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare-release-assets.outputs.tag }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: gh release upload "$RELEASE_TAG" "$ARCHIVE" --clobber

  bump-homebrew-tap:
    name: Bump Homebrew tap
    runs-on: ubuntu-latest
    needs:
      - prepare-release-assets
      - release-assets
    if: ${{ needs.prepare-release-assets.outputs.betamax_released == 'true' }}
    permissions: {}
    steps:
      - name: Dispatch tap bump
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.prepare-release-assets.outputs.version }}
          TAG: ${{ needs.prepare-release-assets.outputs.tag }}
        run: |
          set -euo pipefail
          gh workflow run bump-package.yml \
            --repo joshka/homebrew-tap \
            --field package=betamax \
            --field version="$VERSION" \
            --field tag="$TAG"

  release-plz-pr:
    name: Release-plz PR
    runs-on: ubuntu-latest
    # release-plz's quickstart runs `release` and `release-pr` as sibling jobs on every `main` push.
    # In this repo the release job publishes via a protected environment and then uploads binary
    # assets in the same workflow run. If `release-pr` also runs on a release-PR merge, it can read
    # crates.io before the sibling publish finishes and open a stale PR for the versions being
    # released. Skip release commits here; the next ordinary merge will refresh the release PR.
    if: >-
      ${{
        github.repository_owner == 'joshka' &&
        (
          (github.event_name == 'workflow_dispatch' && inputs.operation == 'release-pr') ||
          (
            github.event_name == 'push' &&
            !startsWith(github.event.head_commit.message, 'chore: release') &&
            !contains(github.event.head_commit.message, '): release')
          )
        )
      }}
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Check release PR authentication
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Set RELEASE_PLZ_TOKEN so release PR updates trigger normal checks."
            exit 1
          fi
          gh api user --silent
      # Serialized jobs may wait behind earlier pushes. Start from current main,
      # rather than generating a stale PR from the SHA that queued this run.
      - name: Checkout current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - *install-rust
      - *install-mise
      - name: Run release-plz
        uses: release-plz/action@b8d6b54b02889ff2ae2bb82e8b57c3a8fc1683a5 # v0.5.139
        with:
          command: release-pr
        env:
          # A PAT makes each PR update trigger CI and CodeQL without close/reopen.
          # Keep publishing and asset upload on their job-scoped GITHUB_TOKEN.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}

name: Release-plz

# release-plz owns crate publishing, changelogs, tags, and GitHub Release creation. Binary asset
# jobs stay in this workflow because releases made with the default GITHUB_TOKEN do not trigger
# follow-up workflows:
# https://release-plz.dev/docs/github/token#how-to-trigger-further-workflow-runs
permissions: {}

env:
  LIBGHOSTTY_VT_SYS_CPU: baseline
  # Oldest macOS the release binaries claim to run on: the releases Apple still patches.
  MACOSX_DEPLOYMENT_TARGET: "14.0"

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      operation:
        description: Publish prepared versions or refresh the release PR
        type: choice
        default: release
        options:
          - release
          - release-pr

jobs:
  release-plz-release:
    name: Release-plz release
    environment: release
    runs-on: ubuntu-26.04
    # This job publishes crates and therefore enters the protected `release` environment. Keep it
    # off ordinary `main` pushes so non-release merges do not require release approval.
    #
    # release-plz release PRs are merged with squash commits whose subjects are `chore: release` or
    # the older `chore(<package>): release ...` form. Manual dispatch remains available for repair.
    if: >-
      ${{
        github.repository_owner == 'joshka' &&
        (
          (github.event_name == 'workflow_dispatch' && inputs.operation == 'release') ||
          startsWith(github.event.head_commit.message, 'chore: release') ||
          contains(github.event.head_commit.message, '): release')
        )
      }}
    permissions:
      contents: write
      pull-requests: read
      # crates.io Trusted Publishing uses GitHub OIDC, not CARGO_REGISTRY_TOKEN.
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - &install-rust
        name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - &install-mise
        name: Install mise tools
        uses: jdx/mise-action@v5.2.10
        with:
          install: true
      - name: Run release-plz
        id: release-plz
        uses: release-plz/action@v0.5.148
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    # These release-plz outputs drive the same-run asset upload fan-out:
    # https://release-plz.dev/docs/github/output
    outputs:
      releases: ${{ steps.release-plz.outputs.releases }}
      releases_created: ${{ steps.release-plz.outputs.releases_created }}

  prepare-release-assets:
    name: Prepare release assets
    runs-on: ubuntu-26.04
    needs: release-plz-release
    if: ${{ needs.release-plz-release.outputs.releases_created == 'true' }}
    # The workspace can release betamax-core without a matching CLI release. Only the CLI package
    # receives cargo-binstall archives, so extract its tag and version before building assets.
    outputs:
      betamax_released: ${{ steps.release.outputs.betamax_released }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Read Betamax release
        id: release
        env:
          RELEASES: ${{ needs.release-plz-release.outputs.releases }}
        run: |
          set -euo pipefail
          version="$(jq -r '.[] | select(.package_name == "betamax") | .version' <<<"$RELEASES" | head -n1)"
          tag="$(jq -r '.[] | select(.package_name == "betamax") | .tag' <<<"$RELEASES" | head -n1)"
          if [[ -z "$version" || -z "$tag" ]]; then
            echo "betamax_released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "betamax_released=true"
            echo "version=$version"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

  release-assets:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    needs: prepare-release-assets
    if: ${{ needs.prepare-release-assets.outputs.betamax_released == 'true' }}
    permissions:
      # Attest each archive where it is built, before it reaches the release, so provenance names
      # the run that built it. The packslip job only links these attestations.
      attestations: write
      contents: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both macOS targets build on arm64; x86_64 is cross-compiled because Intel runners are
          # being retired and Intel Macs are not a priority for this tool.
          - runner: macos-15
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
          # Linux archives link against an explicit glibc so they run on older distributions than
          # the runner. 2.34 covers Ubuntu 22.04+, Debian 12+, RHEL 9+ and Amazon Linux 2023.
          - runner: ubuntu-26.04
            target: x86_64-unknown-linux-gnu
            glibc: "2.34"
          - runner: ubuntu-26.04-arm
            target: aarch64-unknown-linux-gnu
            glibc: "2.34"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          # Build from the tag cargo-binstall downloads from, not from the workflow SHA.
          ref: ${{ needs.prepare-release-assets.outputs.tag }}
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Install mise tools
        uses: jdx/mise-action@v5.2.10
        with:
          install: true
      - name: Cache release dependencies
        uses: Swatinem/rust-cache@v2.9.3
        with:
          prefix-key: v2-rust-baseline
          key: release-${{ matrix.target }}-${{ hashFiles('.mise.toml') }}
          env-vars: CARGO CC CFLAGS CXX CMAKE RUST LIBGHOSTTY
          cache-targets: true
      - name: Install cargo-zigbuild
        if: ${{ matrix.glibc }}
        uses: taiki-e/install-action@v2.90.6
        with:
          tool: cargo-zigbuild@0.23.4
          fallback: none
      - name: Build CLI
        if: ${{ !matrix.glibc }}
        env:
          TARGET: ${{ matrix.target }}
        run: mise run build-release -- "$TARGET"
      # cargo-zigbuild links with the mise-pinned Zig against glibc stubs for the `.<version>` suffix
      # and writes the binary to the usual target/<triple> directory.
      - name: Build CLI for glibc ${{ matrix.glibc }}
        if: ${{ matrix.glibc }}
        env:
          TARGET: ${{ matrix.target }}
          GLIBC: ${{ matrix.glibc }}
        run: cargo zigbuild --locked --release -p betamax --target "$TARGET.$GLIBC"
      - name: Check glibc floor
        if: ${{ matrix.glibc }}
        env:
          TARGET: ${{ matrix.target }}
          GLIBC: ${{ matrix.glibc }}
        run: |
          set -euo pipefail
          scripts/check-glibc-floor.sh "target/$TARGET/release/betamax" "$GLIBC"
          "target/$TARGET/release/betamax" --version
      - name: Package archive
        id: package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.prepare-release-assets.outputs.version }}
        run: |
          set -euo pipefail
          archive="$(scripts/package-binstall-archive.sh "$TARGET" "$VERSION" target/dist)"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
      - name: Attest archive
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: ${{ steps.package.outputs.archive }}
      - name: Upload archive
        env:
          # This token only mutates the release created earlier in the same workflow run.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare-release-assets.outputs.tag }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: gh release upload "$RELEASE_TAG" "$ARCHIVE" --clobber

  sign-release-manifest:
    name: Sign packslip manifest
    runs-on: ubuntu-26.04
    needs:
      - prepare-release-assets
      - release-assets
    if: ${{ needs.prepare-release-assets.outputs.betamax_released == 'true' }}
    # packslip signs a manifest of the uploaded archives with this workflow's OIDC identity, so
    # `mise use packslip:joshka/betamax` can verify the signer and each archive's digest. The project
    # is the repository itself; `version` is set because `betamax-vX.Y.Z` tags are not semver.
    # This job has read-only contents access so the action cannot change the release; the next job
    # uploads the bundle. Consumers pin the signing workflow file, so keep signing in this file.
    # https://packslip.dev/docs/publishing/
    permissions:
      contents: read
      id-token: write
    steps:
      # The manifest records its source commit, which defaults to the workflow SHA. A manual
      # dispatch can run from a later commit than the tag, so record the tagged commit instead.
      - name: Resolve tagged commit
        id: commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare-release-assets.outputs.tag }}
        run: |
          set -euo pipefail
          sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      # `attest: link` only writes lookup URLs, so check that every archive on the release has a
      # build attestation from this repository before signing.
      - name: Check build attestations
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare-release-assets.outputs.tag }}
          VERSION: ${{ needs.prepare-release-assets.outputs.version }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/attested"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "betamax-$VERSION-*.tgz" --dir "$dir"
          for archive in "$dir"/*.tgz; do
            gh attestation verify "$archive" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-plz.yml"
          done
      - name: Sign manifest
        id: packslip
        uses: jdx/packslip@v1.11.4
        with:
          commit: ${{ steps.commit.outputs.sha }}
          tag: ${{ needs.prepare-release-assets.outputs.tag }}
          version: ${{ needs.prepare-release-assets.outputs.version }}
          # Sign the copies the previous step verified, not a second download.
          artifacts: ${{ runner.temp }}/attested/betamax-${{ needs.prepare-release-assets.outputs.version }}-*.tgz
          bin: betamax
          attest: link
          upload: false
      - name: Stage signed bundle
        uses: actions/upload-artifact@v7.0.2
        with:
          name: packslip-bundle
          path: ${{ steps.packslip.outputs.bundle }}
          if-no-files-found: error

  upload-release-manifest:
    name: Upload packslip manifest
    runs-on: ubuntu-26.04
    needs:
      - prepare-release-assets
      - sign-release-manifest
    permissions:
      contents: write
    steps:
      - name: Download signed bundle
        uses: actions/download-artifact@v8.0.2
        with:
          name: packslip-bundle
          path: packslip
      - name: Upload signed bundle
        env:
          # This token only mutates the release created earlier in the same workflow run.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare-release-assets.outputs.tag }}
        run: |
          set -euo pipefail
          test -f packslip/packslip.sigstore.json
          gh release upload "$RELEASE_TAG" packslip/packslip.sigstore.json \
            --repo "$GITHUB_REPOSITORY" --clobber

  bump-homebrew-tap:
    name: Bump Homebrew tap
    runs-on: ubuntu-26.04
    needs:
      - prepare-release-assets
      - release-assets
    if: ${{ needs.prepare-release-assets.outputs.betamax_released == 'true' }}
    permissions: {}
    steps:
      - name: Dispatch tap bump
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.prepare-release-assets.outputs.version }}
          TAG: ${{ needs.prepare-release-assets.outputs.tag }}
        run: |
          set -euo pipefail
          gh workflow run bump-package.yml \
            --repo joshka/homebrew-tap \
            --field package=betamax \
            --field version="$VERSION" \
            --field tag="$TAG"

  release-plz-pr:
    name: Release-plz PR
    runs-on: ubuntu-26.04
    # release-plz's quickstart runs `release` and `release-pr` as sibling jobs on every `main` push.
    # In this repo the release job publishes via a protected environment and then uploads binary
    # assets in the same workflow run. If `release-pr` also runs on a release-PR merge, it can read
    # crates.io before the sibling publish finishes and open a stale PR for the versions being
    # released. Skip release commits here; the next ordinary merge will refresh the release PR.
    if: >-
      ${{
        github.repository_owner == 'joshka' &&
        (
          (github.event_name == 'workflow_dispatch' && inputs.operation == 'release-pr') ||
          (
            github.event_name == 'push' &&
            !startsWith(github.event.head_commit.message, 'chore: release') &&
            !contains(github.event.head_commit.message, '): release')
          )
        )
      }}
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Check release PR authentication
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Set RELEASE_PLZ_TOKEN so release PR updates trigger normal checks."
            exit 1
          fi
          gh api user --silent
      # Serialized jobs may wait behind earlier pushes. Start from current main,
      # rather than generating a stale PR from the SHA that queued this run.
      - name: Checkout current main
        uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - *install-rust
      - *install-mise
      - name: Run release-plz
        uses: release-plz/action@v0.5.148
        with:
          command: release-pr
        env:
          # A PAT makes each PR update trigger CI and CodeQL without close/reopen.
          # Keep publishing and asset upload on their job-scoped GITHUB_TOKEN.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}

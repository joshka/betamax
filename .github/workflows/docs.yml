name: Docs

# The docs site is a pnpm/Starlight project, but the workflow still installs mise first so CI uses
# the same Node and pnpm versions as local `mise run docs-site-*` commands.
on:
  pull_request:
    paths:
      - ".github/workflows/docs.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "site/**"
      - "scripts/check-visual-workflow-media.py"
      - ".gitattributes"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/docs.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "site/**"
      - "scripts/check-visual-workflow-media.py"
      - ".gitattributes"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false

      - name: Install mise tools
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          install: true

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile

      - name: Check docs
        run: mise run docs-site-check

      - name: Check worked-example source media
        run: python3 scripts/check-visual-workflow-media.py site/public

      - name: Build docs
        run: mise run docs-site-build

      - name: Check generated media
        run: |
          set -euo pipefail
          file site/dist/assets/betamax-hero-terminal.png | grep -F "PNG image data"
          file site/dist/assets/betamax-hero-quick-start.gif | grep -F "GIF image data"
          grep -F "<table>" site/dist/reference/vhs-differences/index.html
          if grep -F "<p>| Area" site/dist/reference/vhs-differences/index.html; then
            echo 'Expected a rendered comparison table, found Markdown prose' >&2
            exit 1
          fi
          python3 scripts/check-visual-workflow-media.py site/dist

      - name: Upload Pages artifact
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    name: Deploy docs
    needs: build
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      # GitHub Pages custom workflows require OIDC in addition to pages:write.
      # https://docs.github.com/en/pages/getting-started-with-github-pages/using-custom-workflows-with-github-pages
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

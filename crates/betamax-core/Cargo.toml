[package]
name = "betamax-core"
description = "Core library for Rust-first VHS-style terminal capture"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "README.md"
build = "build.rs"
keywords = ["terminal", "capture", "testing", "ghostty", "vhs"]
categories = ["development-tools::testing", "multimedia", "command-line-utilities"]
include = [
    "Cargo.toml",
    "README.md",
    "THIRD_PARTY.md",
    "build.rs",
    "src/**/*.rs",
    "tests/**/*.rs",
    "tests/fixtures/*.vt",
    "tests/fixtures/*.py",
    "resources/ghostty/themes/**",
    "resources/vhs/**",
]

[features]
default = ["bundled-font"]
# Embed JetBrains Mono, the default `FontFamily`, through the OFL-1.1 `betamax-fonts` crate so
# default output does not depend on installed fonts.
bundled-font = ["dep:betamax-fonts"]

[dependencies]
base64.workspace = true
betamax-fonts = { workspace = true, optional = true }
color_quant.workspace = true
cosmic-text.workspace = true
gif.workspace = true
image.workspace = true
image-webp.workspace = true
libghostty-vt.workspace = true
miette.workspace = true
png.workspace = true
portable-pty.workspace = true
qwertty-term-sprite.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
shell-words.workspace = true
tiny-skia.workspace = true
tracing.workspace = true

[dev-dependencies]
# Decodes and composites GIF frames in tests, independently of the writer.
image = { workspace = true, features = ["gif"] }
indoc.workspace = true

[lints]
workspace = true

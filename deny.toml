[advisories]
# `ttf-parser` is a transitive dependency of `cosmic-text` with no safe upgrade available.
ignore = ["RUSTSEC-2026-0192"]

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

# The published sprite rasterizer depends on these BSD-3-Clause drawing libraries.
[[licenses.exceptions]]
name = "tiny-skia"
allow = ["BSD-3-Clause"]

[[licenses.exceptions]]
name = "tiny-skia-path"
allow = ["BSD-3-Clause"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
